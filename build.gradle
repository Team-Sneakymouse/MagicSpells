import java.time.Instant
import java.time.ZoneOffset
import java.time.format.DateTimeFormatter

import org.gradle.api.credentials.PasswordCredentials
import org.gradle.authentication.http.BasicAuthentication

plugins {
  id("org.jetbrains.kotlin.jvm") version "2.4.10"
  id("dev.magicspells.msjava")
}

wrapper {
  gradleVersion = "9.5.0"
  setDistributionType(Wrapper.DistributionType.ALL)
}

def gitDerivedVersion = providers.exec {
  workingDir(rootDir)
  commandLine("git", "show", "-s", "--format=%ct:%h", "--abbrev=12", "HEAD")
}.standardOutput.asText.map { commit ->
  def parts = commit.trim().split(":", 2)
  def date = DateTimeFormatter.ofPattern("yyyy.MM.dd").withZone(ZoneOffset.UTC)
      .format(Instant.ofEpochSecond(parts[0] as long))
  "${date}-${parts[1]}"
}.get()

allprojects {
  group = "io.github.team-sneakymouse"
  version = gitDerivedVersion
}

// Convenience aliases so ./gradlew runServer works from the MagicSpells root
// (run-paper is applied on :core).
tasks.register("runServer") {
  group = "run"
  description = "Runs a Paper 26.2 test server with the MagicSpells plugin."
  dependsOn(":core:runServer")
}

def mavenArtifactIdFor = { Project project ->
  switch (project.path) {
    case ":core":
      return "magicspells-core"
    case ":nms:shared":
      return "magicspells-nms-shared"
    default:
      return "magicspells-${project.name}"
  }
}

def pluginArchiveBaseNameFor = { Project project ->
  switch (project.path) {
    case ":core":
      return "MagicSpells"
    case ":shop":
      return "MagicSpellsShop"
    case ":factions":
      return "MagicSpellsFactions"
    case ":memory":
      return "MagicSpellsMemory"
    case ":teams":
      return "MagicSpellsTeams"
    case ":towny":
      return "MagicSpellsTowny"
    default:
      return null
  }
}

subprojects {
  apply plugin: "dev.magicspells.msjava"
  apply plugin: "org.jetbrains.kotlin.jvm"

  dependencies {
    // compileOnly: provided by the server at runtime
    compileOnly(group: "io.papermc.paper", name: "paper-api", version: "26.2.build.116-stable")
  }

  processResources {
    inputs.property("version", version)
    expand(["version": version])
  }

  def pluginArchiveBaseName = pluginArchiveBaseNameFor(project)
  if (pluginArchiveBaseName != null) {
    tasks.named("jar", Jar).configure {
      // :core also builds a shaded deployable JAR; keep the plain library JAR distinct.
      if (project.path == ":core") {
        archiveFileName.set("magicspells-core-${project.version}.jar")
      } else {
        archiveFileName.set("${pluginArchiveBaseName}-${project.version}.jar")
      }
    }
  }

  // Paperweight NMS modules are build-time only; publish library modules to sneakyrp.
  if (project.path != ":nms" && project.path != ":nms:v26_2") {
    java {
      withSourcesJar()
      withJavadocJar()
    }

    tasks.withType(Javadoc).configureEach {
      options.encoding = "UTF-8"
      options.addStringOption("Xdoclint:none", "-quiet")
      failOnError = false
    }

    // flatDir/plugin JARs produce runtime deps with null group in Gradle metadata.
    tasks.withType(org.gradle.api.publish.tasks.GenerateModuleMetadata).configureEach {
      enabled = false
    }

    publishing {
      publications {
        maven(MavenPublication) {
          from components.java
          artifactId = mavenArtifactIdFor(project)

          pom {
            name.set(findProperty("POM_NAME") ?: "MagicSpells")
            description.set(findProperty("POM_DESCRIPTION")
              ?: "Paper plugin framework for configurable spells and server mechanics.")
            inceptionYear.set(findProperty("POM_INCEPTION_YEAR") ?: "2011")
            url.set(findProperty("POM_URL") ?: "https://github.com/Team-Sneakymouse/MagicSpells")

            licenses {
              license {
                name.set(findProperty("POM_LICENSE_NAME") ?: "GNU General Public License v3.0")
                url.set(findProperty("POM_LICENSE_URL") ?: "https://www.gnu.org/licenses/gpl-3.0.txt")
              }
            }

            developers {
              developer {
                id.set(findProperty("POM_DEVELOPER_ID") ?: "team-sneakymouse")
                name.set(findProperty("POM_DEVELOPER_NAME") ?: "Team Sneakymouse")
                url.set(findProperty("POM_DEVELOPER_URL") ?: "https://github.com/Team-Sneakymouse")
              }
            }

            scm {
              url.set(findProperty("POM_SCM_URL") ?: "https://github.com/Team-Sneakymouse/MagicSpells")
              connection.set(findProperty("POM_SCM_CONNECTION")
                ?: "scm:git:git@github.com:Team-Sneakymouse/MagicSpells.git")
              developerConnection.set(findProperty("POM_SCM_DEVELOPER_CONNECTION")
                ?: "scm:git:git@github.com:Team-Sneakymouse/MagicSpells.git")
            }

            // Keep published POMs free of plugin-only / SNAPSHOT deps consumers cannot resolve.
            withXml {
              def dependenciesNode = asNode().get("dependencies")
              if (dependenciesNode == null || dependenciesNode.isEmpty()) {
                return
              }
              def depsContainer = dependenciesNode[0]
              def allowedGroupPrefixes = ["io.github.team-sneakymouse", "org.jetbrains"]
              def toRemove = []
              depsContainer.dependency?.each { dep ->
                def depVersion = dep.version?.text() ?: ""
                def depGroupId = dep.groupId?.text() ?: ""
                def allowed = allowedGroupPrefixes.any { depGroupId.startsWith(it) }
                if (!allowed || depVersion.endsWith("-SNAPSHOT")) {
                  toRemove.add(dep)
                }
              }
              toRemove.each { depsContainer.remove(it) }
              if (depsContainer.dependency == null || depsContainer.dependency.isEmpty()) {
                asNode().remove(depsContainer)
              }
            }
          }
        }
      }
      repositories {
        maven {
          name = "sneakyrp"
          url = uri("https://maven.sneakyrp.com/releases")
          credentials(PasswordCredentials)
          authentication {
            basic(BasicAuthentication)
          }
        }
      }
    }
  }
}
