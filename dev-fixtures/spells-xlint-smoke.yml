# Final Xlint leftovers smoke set. Wipe other spells-*.yml in run if you want a clean slate.
# cp MagicSpells/dev-fixtures/spells-xlint-smoke.yml MagicSpells/core/run/plugins/MagicSpells/
# /ms reload — Checklist: MANUAL-TEST-XLINT.md

magic-items:
  xlint_menu_weapons-sword:
    type: iron_sword
    name: "&bXLIN Menu Sword"
  xlint_menu_weapons-axe:
    type: iron_axe
    name: "&bXLIN Menu Axe"
  xlint_stew_json:
    type: suspicious_stew
    name: "&eXLIN Lenient Stew"

variables:
  xlint_score:
    type: player
    permanent: false
    default: 0
    scoreboard-title: "XLIN Score"
    scoreboard-position: sidebar

recipes:
  xlint_stone_slab:
    type: stonecutting
    result: stone_slab
    ingredient: stone
    namespace-key: xlint_stone_slab
    group: ignored-for-stonecutting
  xlint_smith_diamond:
    type: smithing
    result: diamond_sword
    base: iron_sword
    addition: diamond
    namespace-key: xlint_smith_diamond

xlint_noop:
  spell-class: ".instant.DummySpell"
  helper-spell: true

# --- CraftSpell (MenuType.CRAFTING) ---

xlint_craft:
  spell-class: ".instant.CraftSpell"
  name: xlint_craft
  always-granted: true
  str-cast-self: "XLIN: crafting table opened"

# --- MagicItemMenuSpell (Adventure lore) ---

xlint_menu:
  spell-class: ".MagicItemMenuSpell"
  name: xlint_menu
  always-granted: true
  target-self: true
  can-target: self
  str-cast-self: "XLIN: magic item menu opened"
  str-no-target: "XLIN: menu no target (unexpected with target-self)"

# --- ItemSpray custom model data component ---

xlint_spray:
  spell-class: ".instant.DummySpell"
  name: xlint_spray
  always-granted: true
  str-cast-self: "XLIN: item spray"
  effects:
    effect1:
      position: caster
      effect: itemspray
      type: diamond
      amount: 8
      force: 0.4
      duration: 20
      custom-model-data: 7
      fake: true

# --- Enchantment registry lookup ---

xlint_enchant:
  spell-class: ".instant.EnchantSpell"
  name: xlint_enchant
  always-granted: true
  enchantments:
    - sharpness 3
  safe-enchants: true
  str-cast-self: "XLIN: sharpness applied (hold an enchantable weapon)"

# --- tippedarrow → Arrow class ---

xlint_arrow:
  spell-class: ".instant.ProjectileSpell"
  name: xlint_arrow
  always-granted: true
  projectile-type: tippedarrow
  projectile-velocity: 20
  str-cast-self: "XLIN: tippedarrow projectile"

# --- Magic item string parse (Strictness.LENIENT) ---

xlint_give_json:
  spell-class: ".instant.ConjureSpell"
  name: xlint_give_json
  always-granted: true
  add-to-inventory: true
  items:
    - "diamond_sword{name:\"&bXLIN Lenient\"}"
  str-cast-self: "XLIN: conjured sword via JSON string form"

# --- Variable scoreboard (Criteria.DUMMY) ---

xlint_set_score:
  spell-class: ".instant.DummySpell"
  name: xlint_set_score
  always-granted: true
  variable-mods-cast:
    - xlint_score = 42
  str-cast-self: "XLIN: set xlint_score=42 (check sidebar)"

# --- PasteSpell (WorldEdit newEditSessionBuilder) ---

xlint_paste:
  spell-class: ".targeted.PasteSpell"
  name: xlint_paste
  always-granted: true
  range: 20
  schematic: froststone.schem
  paste-air: false
  undo-delay: 100
  str-cast-self: "XLIN: pasted froststone (undo ~5s)"
  str-no-target: "XLIN: look at a block"

# --- Recipes smoke helpers (give ingredients) ---

xlint_give_recipe_mats:
  spell-class: ".instant.ConjureSpell"
  name: xlint_give_recipe_mats
  always-granted: true
  add-to-inventory: true
  items:
    - stone 8
    - iron_sword 1
    - diamond 1
  str-cast-self: "XLIN: gave stone + iron sword + diamond for recipe checks"
