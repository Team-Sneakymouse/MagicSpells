# Fresh Xlint smoke set (wipe other spells-*.yml in run if you want a clean slate).
# Copy: cp MagicSpells/dev-fixtures/spells-xlint-smoke.yml MagicSpells/core/run/plugins/MagicSpells/
# Then /ms reload. Cast: /c <spell>
# Checklist: MANUAL-TEST-XLINT.md

magic-items:
  xlint_attr_sword:
    type: diamond_sword
    name: "&bXLIN Attr Sword"
    attributes:
      - "generic.attack_damage 8 add_number mainhand"
  xlint_stew:
    type: suspicious_stew
    name: "&eXLIN Stew"
    potion-effects:
      - "night_vision 100"

xlint_noop:
  spell-class: ".instant.DummySpell"
  helper-spell: true

# --- AttributeModifier slot group (magic item) ---

xlint_give_attr:
  spell-class: ".instant.ConjureSpell"
  name: xlint_give_attr
  always-granted: true
  add-to-inventory: true
  items:
    - xlint_attr_sword 1
  str-cast-self: "XLIN: gave attr sword (mainhand attack_damage)"

# --- Suspicious stew (SuspiciousEffectEntry) ---

xlint_give_stew:
  spell-class: ".instant.ConjureSpell"
  name: xlint_give_stew
  always-granted: true
  add-to-inventory: true
  items:
    - xlint_stew 1
  str-cast-self: "XLIN: gave suspicious stew (eat for night vision)"

# --- Tree (generateTree + Random) ---

xlint_tree:
  spell-class: ".targeted.TreeSpell"
  name: xlint_tree
  always-granted: true
  range: 20
  tree-type: birch
  animation-speed: 40
  str-cast-self: "XLIN: birch tree growing"
  str-no-target: "XLIN: look at a solid block"

# --- Falling block spawn ---

xlint_fall_sand:
  spell-class: ".targeted.MaterializeSpell"
  name: xlint_fall_sand
  always-granted: true
  range: 20
  block-type: sand
  falling: true
  fall-height: 3
  temporary: false
  str-cast-self: "XLIN: sand falling block spawned"
  str-no-target: "XLIN: look at a block"

# --- Cat / frog registry variants ---

xlint_spawn_cat:
  spell-class: ".targeted.SpawnEntitySpell"
  name: xlint_spawn_cat
  always-granted: true
  range: 20
  duration: 100
  entity:
    entity: cat
    type: black
  str-cast-self: "XLIN: spawned black cat"
  str-no-target: "XLIN: look at ground"

xlint_spawn_frog:
  spell-class: ".targeted.SpawnEntitySpell"
  name: xlint_spawn_frog
  always-granted: true
  range: 20
  duration: 100
  entity:
    entity: frog
    type: warm
  str-cast-self: "XLIN: spawned warm frog"
  str-no-target: "XLIN: look at ground"

# --- Swim passives ---

xlint_startswim:
  spell-class: ".PassiveSpell"
  name: xlint_startswim
  always-granted: true
  cast-without-target: true
  triggers:
    - startswim
  spells:
    - xlint_noop
  str-cast-self: "XLIN: startswim"

xlint_stopswim:
  spell-class: ".PassiveSpell"
  name: xlint_stopswim
  always-granted: true
  cast-without-target: true
  triggers:
    - stopswim
  spells:
    - xlint_noop
  str-cast-self: "XLIN: stopswim"

# --- Summon from sign (FRONT side line 0) ---

xlint_summon:
  spell-class: ".targeted.SummonSpell"
  name: xlint_summon
  always-granted: true
  range: 10
  max-accept-delay: 200
  str-usage: "XLIN: look at a sign with a player name on line 1, or /c xlint_summon <player>"
  str-cast-self: "XLIN: summon request sent"
  str-no-target: "XLIN: need a sign or player arg"
