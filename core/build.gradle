import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id("com.gradleup.shadow") version "9.6.1"
    id("xyz.jpenilla.run-paper") version "3.0.2"
}

repositories {
    // Restricted to the provider API for local development before its first publication.
    mavenLocal {
        content { includeModule("io.github.team-sneakymouse", "SneakyDiagnostics-API") }
    }
    flatDir {
        // CMI is paid/proprietary and has no public Maven; keep the jar in libs/.
        dirs '../libs'
    }
    maven {
        name = "playpro-repo"
        url = uri("https://maven.playpro.com")
    }
    mavenCentral()
    maven {
        name = "sneakyrp"
        url = uri("https://maven.sneakyrp.com/releases")
    }
}

dependencies {
    compileOnly("io.github.team-sneakymouse:SneakyDiagnostics-API:1.0.0")
    testImplementation("io.github.team-sneakymouse:SneakyDiagnostics-API:1.0.0")
    shadow("org.apache.commons:commons-math4-core:4.0-beta1")
    shadow("com.github.Chronoken:EffectLib:477d459")
    shadow("co.aikar:acf-paper:0.5.1-SNAPSHOT")
    shadow("org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.4.10")
    shadow("com.googlecode.json-simple:json-simple:1.1.1")

    shadow(project(path: ":nms:shared", configuration: "apiElements"))
    shadow(project(path: ":nms:v26_2")) { transitive = false }

    // CMI is paid/proprietary via flatDir (libs/); no Maven coordinates.
    compileOnly(":CMI-9.8.9.8@jar")
    // Latest GitHub tag published on JitPack (1.5.9.9 is on Spigot but not tagged for JitPack yet).
    compileOnly("com.github.Zrips:CMILib:1.5.9.6") { transitive = false }
    implementation("commons-codec:commons-codec:1.16.1")
    compileOnly("io.github.team-sneakymouse:sneakyutils:2026.10.18-4b5831b0b997")
    testImplementation("io.github.team-sneakymouse:sneakyutils:2026.10.18-4b5831b0b997")
    compileOnly("io.github.team-sneakymouse:sneakycharactermanager-paper:2026.10.09-84db8a554af1") { transitive = false }
    compileOnly("io.github.team-sneakymouse:sneakybagofholding:2026.10.09-a79a55f6d44b") { transitive = false }
    compileOnly("io.github.team-sneakymouse:sneakyvaults:2026.10.09-306ea91d36ff") { transitive = false }
    implementation("com.comphenix.protocol:ProtocolLib:5.1.0") { transitive = false }
    implementation("com.github.libraryaddict:LibsDisguises:v10.0.25") { transitive = false }
    // VaultAPI only — Vault is provided at runtime. Avoid vault:master-SNAPSHOT (JitPack metadata flaky).
    compileOnly("com.github.MilkBowl:VaultAPI:1.7.1") { transitive = false }
    implementation("me.clip:placeholderapi:2.11.6") { transitive = false }
    compileOnly("com.github.GriefPrevention:GriefPrevention:16.18.7") { transitive = false }
    implementation("net.coreprotect:coreprotect:22.4") { transitive = false }
    implementation("com.github.Xezard:XGlow:1.1.0") {
        exclude(module: "XGlowPlugin")
        exclude(module: "XGlowExample")
    }

    testImplementation(platform("org.junit:junit-bom:5.11.4"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testImplementation("io.papermc.paper:paper-api:26.2.build.116-stable")
    testRuntimeOnly("com.github.Chronoken:EffectLib:477d459")
    // Index + YAML fixtures for SpellSnippetValidator.
    testImplementation("com.google.code.gson:gson:2.11.0")
    testImplementation("org.yaml:snakeyaml:2.3")
    // Gradle 9 no longer provides the launcher transitively.
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")

    // Pin to last 7.1.0-SNAPSHOT built for JVM 21; newer builds require JVM 25.
    implementation("com.sk89q.worldguard:worldguard-core:7.1.0-20250824.193056-15") { transitive = false }
    implementation("com.sk89q.worldguard:worldguard-bukkit:7.1.0-20250824.193056-15") { transitive = false }
    implementation("com.sk89q.worldedit:worldedit-core:7.4.0-SNAPSHOT") { transitive = false }
    implementation("com.sk89q.worldedit:worldedit-bukkit:7.4.0-SNAPSHOT") { transitive = false }

}

test {
    useJUnitPlatform()
}

base {
    archivesName = "MagicSpells"
}

jar {
    manifest {
        attributes(
            "paperweight-mappings-namespace": "mojang"
        )
    }
}

shadowJar {
    configurations = [project.configurations.shadow]

    relocate("org.apache.commons.math4", "com.nisovin.magicspells.shaded.org.apache.commons.math4")
    relocate("de.slikey.effectlib", "com.nisovin.magicspells.shaded.effectlib")
    relocate("kotlin", "com.nisovin.magicspells.shaded.kotlin")
    relocate("co.aikar.commands", "com.nisovin.magicspells.shaded.acf")
    relocate("co.aikar.locales", "com.nisovin.magicspells.shaded.locales")
    // Non-empty classifier: empty classifier registers shadowJar as a second main (null) artifact for Maven publish.
    archiveClassifier.set("shaded")
    archiveFileName.set("MagicSpells-${project.version}.jar")
}

// Keep the Java component unshaded for API consumers. Deployment uses a separate publication.
components.named("java") {
    withVariantsFromConfiguration(configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        plugin(MavenPublication) {
            artifactId = "magicspells"
            // Explicit artifact: no library dependency graph or duplicate plain/shaded main JARs.
            artifact(tasks.named("shadowJar")) {
                classifier = ""
            }
        }
    }
}

def verifyPluginJar = tasks.register("verifyPluginJar") {
    group = "verification"
    description = "Checks that the deployable JAR bundles relocated ACF and the supported NMS implementation."
    dependsOn(rootProject.tasks.named("verifyPublications"))
    def pluginJar = tasks.named("shadowJar").flatMap { it.archiveFile }
    inputs.file(pluginJar)
    doLast {
        new java.util.zip.ZipFile(pluginJar.get().asFile).withCloseable { jar ->
            def required = [
                "plugin.yml",
                "com/nisovin/magicspells/MagicSpells.class",
                "com/nisovin/magicspells/shaded/acf/BaseCommand.class",
                "com/nisovin/magicspells/shaded/kotlin/jvm/internal/Intrinsics.class",
                "com/nisovin/magicspells/volatilecode/VolatileCodeHandle.class",
                "com/nisovin/magicspells/volatilecode/v26_2/VolatileCode_v26_2.class"
            ]
            def missing = required.findAll { jar.getEntry(it) == null }
            if (!missing.isEmpty()) {
                throw new GradleException("Deployable MagicSpells JAR is missing bundled entries: ${missing}")
            }
        }
        logger.lifecycle("Deployable JAR verified: plugin descriptor, relocated ACF/Kotlin, shared NMS and v26_2")
    }
}

tasks.named("check") {
    dependsOn(verifyPluginJar)
}

// Publishing directly must not bypass the deployment guards (including publishToMavenLocal).
tasks.withType(org.gradle.api.publish.maven.tasks.AbstractPublishToMaven).configureEach {
    dependsOn(rootProject.tasks.named("verifyPublications"))
    if (name.startsWith("publishPluginPublication")) {
        dependsOn(verifyPluginJar)
    }
}

compileKotlin {
    compilerOptions {
        jvmTarget.set(JvmTarget.JVM_25)
        javaParameters.set(true)
    }
}

compileTestKotlin {
    compilerOptions {
        jvmTarget.set(JvmTarget.JVM_25)
    }
}

tasks.named("build") {
    dependsOn(tasks.shadowJar)
}

tasks.named("runServer").configure {
    minecraftVersion("26.2")
    // Goooler shadow keeps the shadowJar task name; pin explicitly for the test server.
    pluginJars.from(tasks.named("shadowJar").flatMap { it.archiveFile })
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.addAll(["-Xlint:deprecation", "-Xlint:unchecked"])
}
