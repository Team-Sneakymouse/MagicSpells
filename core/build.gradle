import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id("com.gradleup.shadow") version "9.6.1"
    id("xyz.jpenilla.run-paper") version "3.0.2"
}

repositories {
    flatDir {
        // CMI is paid/proprietary and has no public Maven; keep the jar in libs/.
        dirs '../libs'
    }
    maven {
        name = "playpro-repo"
        url = uri("https://maven.playpro.com")
    }
    mavenCentral()
    maven {
        name = "sneakyrp"
        url = uri("https://maven.sneakyrp.com/releases")
    }
}

dependencies {
    shadow(group: "org.apache.commons", name: "commons-math4-core", version: "4.0-beta1")
    shadow(group: "com.github.Chronoken", name: "EffectLib", version: "477d459")
    shadow(group: "co.aikar", name: "acf-paper", version: "0.5.1-SNAPSHOT")
    shadow(group: "org.jetbrains.kotlin", name: "kotlin-stdlib-jdk8", version: "2.4.10")
    shadow(group: "com.googlecode.json-simple", name: "json-simple", version: "1.1.1")

    shadow(project(path: ":nms:shared", configuration: "apiElements"))
    shadow(project(path: ":nms:v26_2")) { transitive = false }

    compileOnly(name: 'CMI-9.8.9.8', ext: 'jar')
    // Latest GitHub tag published on JitPack (1.5.9.9 is on Spigot but not tagged for JitPack yet).
    compileOnly(group: "com.github.Zrips", name: "CMILib", version: "1.5.9.6") { transitive = false }
    implementation(group: "commons-codec", name: "commons-codec", version: "1.16.1")
    compileOnly(group: "io.github.team-sneakymouse", name: "sneakycharactermanager-paper", version: "2026.10.09-84db8a554af1") { transitive = false }
    compileOnly(group: "io.github.team-sneakymouse", name: "sneakybagofholding", version: "2026.10.09-a79a55f6d44b") { transitive = false }
    compileOnly(group: "io.github.team-sneakymouse", name: "sneakyvaults", version: "2026.10.09-306ea91d36ff") { transitive = false }
    implementation(group: "com.comphenix.protocol", name: "ProtocolLib", version: "5.1.0") { transitive = false }
    implementation(group: "com.github.libraryaddict", name: "LibsDisguises", version: "v10.0.25") { transitive = false }
    // VaultAPI only — Vault is provided at runtime. Avoid vault:master-SNAPSHOT (JitPack metadata flaky).
    compileOnly(group: "com.github.MilkBowl", name: "VaultAPI", version: "1.7.1") { transitive = false }
    implementation(group: "me.clip", name: "placeholderapi", version: "2.11.6") { transitive = false }
    compileOnly(group: "com.github.GriefPrevention", name: "GriefPrevention", version: "16.18.7") { transitive = false }
    implementation(group: "net.coreprotect", name: "coreprotect", version: "22.4") { transitive = false }
    implementation(group: "com.github.Xezard", name: "XGlow", version: "1.1.0") {
        exclude(module: "XGlowPlugin")
        exclude(module: "XGlowExample")
    }

    testImplementation(platform("org.junit:junit-bom:5.11.4"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    // Gradle 9 no longer provides the launcher transitively.
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")

    // Pin to last 7.1.0-SNAPSHOT built for JVM 21; newer builds require JVM 25.
    implementation(group: "com.sk89q.worldguard", name: "worldguard-core", version: "7.1.0-20250824.193056-15") { transitive = false }
    implementation(group: "com.sk89q.worldguard", name: "worldguard-bukkit", version: "7.1.0-20250824.193056-15") { transitive = false }
    implementation(group: "com.sk89q.worldedit", name: "worldedit-core", version: "7.4.0-SNAPSHOT") { transitive = false }
    implementation(group: "com.sk89q.worldedit", name: "worldedit-bukkit", version: "7.4.0-SNAPSHOT") { transitive = false }

}

test {
    useJUnitPlatform()
}

base {
    archivesName = "MagicSpells"
}

jar {
    manifest {
        attributes(
            "paperweight-mappings-namespace": "mojang"
        )
    }
}

shadowJar {
    configurations = [project.configurations.shadow]

    relocate("org.apache.commons.math4", "com.nisovin.magicspells.shaded.org.apache.commons.math4")
    relocate("de.slikey.effectlib", "com.nisovin.magicspells.shaded.effectlib")
    relocate("kotlin", "com.nisovin.magicspells.shaded.kotlin")
    relocate("co.aikar.commands", "com.nisovin.magicspells.shaded.acf")
    relocate("co.aikar.locales", "com.nisovin.magicspells.shaded.locales")
    // Non-empty classifier: empty classifier registers shadowJar as a second main (null) artifact for Maven publish.
    archiveClassifier.set("shaded")
    archiveFileName.set("MagicSpells-${project.version}.jar")
}

// Maven publishes the plain library JAR only; shadowJar is for the Paper plugins folder.
components.named("java") {
    withVariantsFromConfiguration(configurations.shadowRuntimeElements) {
        skip()
    }
}

compileKotlin {
    compilerOptions {
        jvmTarget.set(JvmTarget.JVM_25)
        javaParameters.set(true)
    }
}

compileTestKotlin {
    compilerOptions {
        jvmTarget.set(JvmTarget.JVM_25)
    }
}

tasks.named("build") {
    dependsOn(tasks.shadowJar)
}

tasks.named("runServer").configure {
    minecraftVersion("26.2")
    // Goooler shadow keeps the shadowJar task name; pin explicitly for the test server.
    pluginJars.from(tasks.named("shadowJar").flatMap { it.archiveFile })
}

